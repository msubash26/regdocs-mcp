[project]
name = "regdocs-mcp"
version = "0.1.0"
description = "MCP server exposing Singapore MAS regulatory-document tools"
readme = "README.md"
authors = [
    { name = "Subash M", email = "msubash26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "mcp[cli]>=2.1,<3",
    "pymupdf>=1.28.2",
]

[project.scripts]
regdocs-mcp = "regdocs_mcp.server:main"
regdocs-index = "regdocs_mcp.build:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pre-commit>=4",
    "jsonschema>=4.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Async tests run on anyio's plugin (auto-registered with anyio, which the SDK
# pulls in), not pytest-asyncio: pytest-asyncio runs an async fixture's setup and
# teardown in different tasks, which trips "cancel scope exited in a different
# task" on every teardown of a session held open across a test.
